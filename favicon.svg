<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Weekly Report">
  <!-- The same report-and-chart idea as icon.svg, stripped to what survives 16px: no calendar,
       no body text, four bold bars and the line that rises over them. -->
  <rect width="64" height="64" rx="15" fill="#0f172a"/>
  <rect x="8" y="9" width="7" height="46" rx="3.5" fill="#8b80ff"/>
  <g fill="#4d9fff">
    <rect x="21" y="34" width="7" height="21" rx="3.5"/>
    <rect x="32" y="28" width="7" height="27" rx="3.5"/>
    <rect x="43" y="22" width="7" height="33" rx="3.5"/>
  </g>
  <polyline points="24.5,26 35.5,19 46.5,11" fill="none" stroke="#7ed957"
            stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
