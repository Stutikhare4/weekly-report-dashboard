<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Weekly Report">
  <defs>
    <linearGradient id="sheet" x1="150" y1="60" x2="360" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="back" x1="96" y1="120" x2="240" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b80ff"/>
      <stop offset="1" stop-color="#5b4fe3"/>
    </linearGradient>
    <linearGradient id="cal" x1="250" y1="250" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="#f6f7fb"/>

  <!-- the purple sheet behind, offset like a stack -->
  <rect x="78" y="118" width="196" height="300" rx="34" fill="url(#back)"/>

  <!-- the report itself -->
  <rect x="110" y="78" width="236" height="320" rx="34" fill="url(#sheet)"/>

  <!-- bar chart -->
  <g fill="#4d9fff">
    <rect x="148" y="214" width="26" height="64"  rx="13"/>
    <rect x="190" y="194" width="26" height="84"  rx="13"/>
    <rect x="232" y="206" width="26" height="72"  rx="13"/>
    <rect x="274" y="160" width="26" height="118" rx="13"/>
  </g>

  <!-- rising trend line over the bars -->
  <polyline points="161,178 203,150 245,166 287,124" fill="none" stroke="#f1f5f9"
            stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#7ed957">
    <circle cx="161" cy="178" r="13"/>
    <circle cx="203" cy="150" r="13"/>
    <circle cx="245" cy="166" r="13"/>
    <circle cx="287" cy="124" r="13"/>
  </g>

  <!-- the lines of text under the chart -->
  <g fill="#f9a826">
    <rect x="148" y="304" width="152" height="18" rx="9"/>
    <rect x="148" y="334" width="152" height="18" rx="9"/>
    <rect x="148" y="364" width="104" height="18" rx="9"/>
  </g>

  <!-- the calendar, sitting over the lower-right corner -->
  <rect x="252" y="268" width="176" height="152" rx="26" fill="url(#cal)"/>
  <path d="M252 294a26 26 0 0 1 26-26h124a26 26 0 0 1 26 26v22H252z" fill="#4d9fff"/>
  <g fill="#f6f7fb">
    <rect x="276" y="334" width="26" height="22" rx="7"/>
    <rect x="314" y="334" width="26" height="22" rx="7"/>
    <rect x="352" y="334" width="26" height="22" rx="7"/>
    <rect x="276" y="370" width="26" height="22" rx="7"/>
    <rect x="314" y="370" width="26" height="22" rx="7"/>
    <rect x="352" y="370" width="26" height="22" rx="7"/>
  </g>
  <!-- the wire binding -->
  <g fill="none" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round">
    <path d="M282 252v30"/><path d="M320 252v30"/><path d="M358 252v30"/><path d="M396 252v30"/>
  </g>
</svg>
